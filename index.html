<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Song For You</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: flex-start;      /* card sits at the TOP */
    justify-content: center;
    font-family: Tahoma, Arial, sans-serif;

    /* Solid dark background for the side bars */
    background: #292727;

    padding: 20px;
    box-sizing: border-box;
    position: relative;
    overflow: hidden;
  }

  /* ===== Full 9:16 image (1080x1920), never stretched ===== */
  .bg-image {
    position: fixed;
    inset: 0;
    background-image: url('pic.jpg');
    background-size: contain;      /* keeps full image visible */
    background-position: center;
    background-repeat: no-repeat;
    background-color: #292727;     /* fills the empty sides */
    z-index: 0;
    pointer-events: none;
  }

  /* ===== Glassmorphism card (no border, no overlay) ===== */
  .card {
    position: relative;
    z-index: 1;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border-radius: 28px;
    padding: 34px 26px 28px;
    max-width: 360px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    border: none;
    box-sizing: border-box;
    margin-top: 10px;
  }

  .heart {
    font-size: 40px;
    line-height: 1;
    margin-bottom: 12px;
  }

  h1 {
    font-size: 19px;
    color: #ffffff;
    margin: 0 0 10px 0;
    font-weight: bold;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
  }

  p {
    font-size: 14px;
    color: #f3e5f5;
    line-height: 1.9;
    margin: 0 0 20px 0;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
  }

  /* Highlighted words: LOVE & YOU */
  .hl {
    color: #f8bbd0;
    font-weight: 700;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
  }

  /* ===== Custom Player ===== */
  .player {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255, 255, 255, 0.12);
    border: none;
    border-radius: 50px;
    padding: 10px 16px 10px 10px;
    box-sizing: border-box;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }

  .play-btn {
    width: 46px;
    height: 46px;
    min-width: 46px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: linear-gradient(135deg, #f06292, #ba68c8);
    color: #fff;
    font-size: 18px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 16px rgba(240, 98, 146, 0.45);
    transition: transform 0.15s ease;
    padding: 0;
  }

  .play-btn:active {
    transform: scale(0.93);
  }

  .track {
    flex: 1;
    text-align: left;
  }

  .bar {
    width: 100%;
    height: 6px;
    background: rgba(255, 255, 255, 0.25);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
  }

  .bar-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #f06292, #ba68c8);
    border-radius: 10px;
    transition: width 0.1s linear;
  }

  .time {
    font-size: 11px;
    color: #f3e5f5;
    margin-top: 5px;
    text-align: left;
  }

  .footer {
    margin-top: 20px;
    font-size: 12px;
    color: #e1bee7;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
  }
</style>
</head>
<body>

  <!-- Full 9:16 background image, never stretched -->
  <div class="bg-image"></div>

  <div class="card">
    <div class="heart">💖</div>
    <h1>A Song For You</h1>
    <p>Maybe i wasn't searching for <b class="hl">LOVE</b>, Maybe i was searching for <b class="hl">YOU</b>.</p>

    <div class="player">
      <button class="play-btn" id="playBtn">▶</button>
      <div class="track">
        <div class="bar" id="bar">
          <div class="bar-fill" id="barFill"></div>
        </div>
        <div class="time" id="time">0:00 / 0:00</div>
      </div>
    </div>

    <div class="footer">🎧 Think of me when you listen</div>

    <audio id="mySong" loop>
      <source src="Harvey-Hers.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
  </div>

  <script>
    var audio   = document.getElementById('mySong');
    var playBtn = document.getElementById('playBtn');
    var bar     = document.getElementById('bar');
    var barFill = document.getElementById('barFill');
    var timeEl  = document.getElementById('time');

    function fmt(sec) {
      if (isNaN(sec)) return '0:00';
      var m = Math.floor(sec / 60);
      var s = Math.floor(sec % 60);
      if (s < 10) s = '0' + s;
      return m + ':' + s;
    }

    function updateUI() {
      if (audio.duration) {
        var pct = (audio.currentTime / audio.duration) * 100;
        barFill.style.width = pct + '%';
        timeEl.textContent = fmt(audio.currentTime) + ' / ' + fmt(audio.duration);
      }
    }

    function togglePlay() {
      if (audio.paused) {
        audio.play().catch(function () {});
      } else {
        audio.pause();
      }
    }

    playBtn.addEventListener('click', togglePlay);

    audio.addEventListener('play', function () {
      playBtn.textContent = '❚❚';
      playBtn.style.fontSize = '15px';
    });

    audio.addEventListener('pause', function () {
      playBtn.textContent = '▶';
      playBtn.style.fontSize = '18px';
    });

    audio.addEventListener('timeupdate', updateUI);
    audio.addEventListener('loadedmetadata', updateUI);

    bar.addEventListener('click', function (e) {
      var rect = bar.getBoundingClientRect();
      var ratio = (e.clientX - rect.left) / rect.width;
      if (audio.duration) {
        audio.currentTime = ratio * audio.duration;
      }
    });

    function tryPlay() {
      audio.play().catch(function () {});
      document.removeEventListener('touchstart', tryPlay);
      document.removeEventListener('click', tryPlay);
    }
    document.addEventListener('touchstart', tryPlay);
    document.addEventListener('click', tryPlay);
  </script>

</body>
</html>
